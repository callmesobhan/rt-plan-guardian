# Template listing EVERY rule with its default severity and parameters.
# Generated by `rtpg rules --format yaml` - do not edit by hand (a test fails if it is stale).
# Copy this file, delete what you do not want to change, and tune the rest. Rules you remove
# still run with these defaults. Add `extends: aapm_mppg11a` (or any built-in/file ruleset)
# under `ruleset:` to inherit another profile and override single rules or parameters.
#
# THESE ARE LIBRARY DEFAULTS, NOT CLINICAL STANDARDS.

ruleset:
  name: My clinic ruleset
  version: "1.0.0"
  description: Describe who owns and approved this file.
  # sources:            # cite the documents your limits come from; reports embed them
  #   - "Author et al. Title. Journal Year;vol:pages. doi:..."

rules:

  # --- Input completeness ----------------------------------------------------
  INPUT-001: { severity: error, params: {"required": ["rtplan", "rtstruct", "rtdose"]} }  # Required DICOM-RT objects were supplied
  INPUT-002: { severity: warning }  # Every supplied RT object belongs to the reviewed case
  INPUT-003: { severity: warning }  # Exactly one plan-level dose identifies the case dose

  # --- Patient identity ------------------------------------------------------
  IDENT-001: { severity: error }  # Patient ID is identical across all objects
  IDENT-002: { severity: warning }  # Patient name, birth date and sex agree across objects
  IDENT-003: { severity: error }  # Each object has its own non-empty SOP Instance UID

  # --- Cross-object linkage --------------------------------------------------
  LINK-001: { severity: error }  # RT Plan references the supplied RT Structure Set
  LINK-002: { severity: error }  # RT Dose references the supplied RT Plan
  LINK-003: { severity: error }  # RT Dose and RT Structure Set share a Frame of Reference
  LINK-004: { severity: error }  # ROIs referenced by the plan's dose references exist in the structure set

  # --- Structure set ---------------------------------------------------------
  STRUCT-001: { severity: error }  # ROI numbers, names and references are well-formed
  STRUCT-002: { severity: error, params: {"required_roi_patterns": []} }  # Required ROIs are present
  STRUCT-003: { severity: warning, params: {"ignore_patterns": []} }  # Every ROI contains contour data
  STRUCT-004: { severity: error, params: {"planar_tolerance_mm": 0.01, "min_points": 3, "allowed_geometric_types": ["CLOSED_PLANAR", "OPEN_PLANAR", "OPEN_NONPLANAR", "POINT"]} }  # Contours are well-formed for their geometric type
  STRUCT-005: { severity: warning }  # Every ROI has an interpreted type
  STRUCT-006: { severity: warning, params: {"nomenclature_file": "", "max_name_length": 16, "case_sensitive": true, "additional_allowed_patterns": [], "ignore_patterns": []} }  # ROI names follow the configured nomenclature (e.g. AAPM TG-263)

  # --- Plan & prescription ---------------------------------------------------
  PLAN-001: { severity: warning, params: {"allowed_statuses": ["APPROVED"]} }  # Plan approval status is acceptable
  PLAN-002: { severity: error, params: {"allowed_radiation_types": ["PHOTON", "ELECTRON", "PROTON", "ION", "MIXED_ION"]} }  # Plan has deliverable content of a supported technique
  PLAN-003: { severity: error, params: {"min_fractions": 1, "max_fractions": 60} }  # Number of fractions is within the configured range
  PLAN-004: { severity: error, params: {"tolerance_percent": 1.0, "prescription_isodose_percent": 0.0, "use_vendor_isodose": true} }  # Prescription equals summed per-fraction dose x fractions
  PLAN-005: { severity: error, params: {"allowed_machines": [], "require_single_machine": true} }  # Treatment machine is named, consistent and allowed

  # --- Beams & delivery (photon, electron, ion) ------------------------------
  BEAM-001: { severity: error }  # Beam numbers are unique and match the fraction groups
  BEAM-002: { severity: error, params: {"weight_tolerance": 0.0001} }  # Control points are complete and meterset weights are monotonic
  BEAM-003: { severity: error }  # Gantry, collimator and couch angles are present and in [0, 360)
  BEAM-004: { severity: error, params: {"allowed_energies": {}} }  # Nominal beam energy is present, positive and allowed
  BEAM-005: { severity: error, params: {"limits": {"MU": [1.0, 2000.0], "MINUTE": [0.0, 120.0], "NP": [0.0, 1000000000000000.0]}} }  # Beam meterset is present, positive and within limits for its unit
  BEAM-006: { severity: warning, params: {"target_patterns": ["^PTV"], "radiation_types": ["PHOTON", "PROTON", "ION", "MIXED_ION"]} }  # Beam isocentre lies inside a target volume
  BEAM-007: { severity: error, params: {"min_leaf_gap_mm": 0.0, "max_abs_position_mm": 200.0} }  # MLC leaves and jaws are physically sane (no crossed pairs, within travel)
  BEAM-008: { severity: warning }  # Beam-limiting devices are declared consistently with their positions

  # --- Proton / ion beams ----------------------------------------------------
  ION-001: { severity: error, params: {"allowed_scan_modes": ["NONE", "UNIFORM", "MODULATED", "MODULATED_SPEC"]} }  # Ion beam definition and scanning parameters are complete
  ION-002: { severity: error }  # Scan spot maps and weights are well-formed
  ION-003: { severity: error, params: {"relative_tolerance": 0.001} }  # Spot weights and segment pairing follow the DICOM scanning model
  ION-004: { severity: error, params: {"min_energy_mev": 0.0, "max_energy_mev": 1000.0} }  # Beam energies are positive and within the machine range
  ION-005: { severity: error, params: {"max_abs_spot_position_mm": 300.0} }  # Scan spots lie within the maximum scan field
  ION-006: { severity: error, params: {"max_snout_position_mm": 700.0} }  # Range shifter and snout settings are consistent

  # --- Electron beams --------------------------------------------------------
  ELEC-001: { severity: error, params: {"allowed_applicator_types": ["ELECTRON_SQUARE", "ELECTRON_RECT", "ELECTRON_CIRC", "ELECTRON_SHORT", "ELECTRON_OPEN", "INTRAOPERATIVE", "STEREOTACTIC"], "allowed_applicator_ids": []} }  # Electron beams specify an applicator of an allowed type
  ELEC-002: { severity: error, params: {"require_cutout": true, "max_abs_block_coordinate_mm": 300.0} }  # Electron cutouts (aperture blocks) are defined and well-formed
  ELEC-003: { severity: warning, params: {"min_ssd_mm": 800.0, "max_ssd_mm": 1200.0} }  # Source-to-surface distance is given and plausible

  # --- Brachytherapy ---------------------------------------------------------
  BRACHY-001: { severity: error, params: {"half_life_tolerance_percent": 2.0} }  # Brachytherapy sources are fully and plausibly defined
  BRACHY-002: { severity: error, params: {"tolerance_percent": 1.0} }  # Total Reference Air Kerma equals source strength x total channel time
  BRACHY-003: { severity: error, params: {"time_weight_tolerance": 1.0e-06, "position_tolerance_mm": 0.01} }  # Channels and dwell control points are structurally consistent
  BRACHY-004: { severity: warning, params: {"max_source_age_days": 120.0} }  # Source strength reference date is not in the future and not stale
  BRACHY-005: { severity: error }  # Application setups agree with the fraction scheme
  BRACHY-006: { severity: error, params: {"max_dwell_s": 600.0, "allowed_step_sizes_mm": [], "step_tolerance_mm": 0.01} }  # Dwell times are non-negative and bounded; step sizes are allowed

  # --- Dose ------------------------------------------------------------------
  DOSE-001: { severity: error, params: {"allowed_units": ["GY"], "allowed_dose_types": ["PHYSICAL"], "allowed_dose_types_charged_particle": ["PHYSICAL", "EFFECTIVE"], "allowed_summation_types": ["PLAN"]} }  # Dose units, type and summation are as expected
  DOSE-002: { severity: error }  # Dose grid is internally consistent
  DOSE-003: { severity: warning, params: {"max_spacing_mm": 3.0} }  # Dose grid resolution is fine enough
  DOSE-004: { severity: warning, params: {"max_percent_of_rx": 110.0, "prescription_isodose_percent": 0.0, "use_vendor_isodose": true} }  # Maximum dose does not exceed the hotspot limit
  DOSE-005: { severity: error, params: {"target_patterns": ["^PTV"]} }  # Target volumes lie inside the dose grid
  DOSE-006: { severity: warning, params: {"volume_percent": 95.0, "min_percent_of_rx": 95.0, "target_patterns": []} }  # Target coverage (DVH point) meets the prescription

  # --- Protocol compliance (ruleset-driven) ----------------------------------
  DVH-001: { severity: error, params: {"constraints": []} }  # Protocol dose-volume constraints are met
