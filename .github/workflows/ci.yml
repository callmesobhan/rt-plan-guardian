name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test (includes docs-in-sync and rule/defect coverage checks)
        run: pytest --cov=rt_plan_guardian --cov-report=term-missing

  # Guard rail: no DICOM or generated reports may ever be committed.
  no-phi-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if DICOM/report artefacts are tracked
        run: |
          if git ls-files | grep -Ei '\.(dcm|rtplan|rtstruct|rtdose)$|(^|/)DICOMDIR$|(^|/)reports/|(^|/)open_data/'; then
            echo "Tracked DICOM or report files found - remove them (possible PHI)." >&2
            exit 1
          fi
